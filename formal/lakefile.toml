name = "pq"
version = "0.1.0"
defaultTargets = ["GordieHowe"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

# Pinned to the Mathlib commit ArkLib uses (tag v4.34.0), so that ArkLib can be
# added as a dependency later without a Mathlib bump.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "GordieHowe"

# The certificate library, opt in: the exported programs, plans and certificates
# (GordieHowe/Generated/), each program's proof system from them, and every module importing one,
# imported by the root GordieHoweCerts.lean under their GordieHowe.* names. The default target
# builds none of them; GordieHowe imports no module of this library (scripts/cert_boundary.py).
[[lean_lib]]
name = "GordieHoweCerts"
globs = ["GordieHoweCerts"]

# The .ghc container and its type-directed decoders (GordieHoweNative/Ghc.lean, Derive.lean,
# Codecs.lean), the loader's term building (Terms.lean), the data types they build
# (GordieHoweNative/Data.lean), and the certificate checkers with every definition their compiled
# code calls (GordieHoweNative/<path>.lean for the module GordieHowe/<path>.lean holding their
# lemmas), compiled to a shared library that Lake loads into every Lean process building a module
# that imports it (precompileModules), so that the loader, the run-time reader and native mode's
# checks run compiled code instead of Lean's interpreter. Lake also builds the shared library of
# every library these modules import, so they import no Mathlib (scripts/check.sh).
[[lean_lib]]
name = "GordieHoweNative"
roots = []
globs = ["GordieHoweNative.+"]
precompileModules = true

# Each program's check (GordieHoweCheck.<P>, written by lib/gordiehowe/compiler/plan_proofs.h):
# the kernel's leaves, one per part of the check, and their composition (Check/Kernel), or one
# compiled run (Check/Native). scripts/cert_mode.sh switches the source directory with the mode of
# the check library. Each program's Core module imports its check.
[[lean_lib]]
name = "GordieHoweCheck"
srcDir = "Check/Kernel"
roots = []
globs = ["GordieHoweCheck.+"]

[[lean_lib]]
name = "LatticeCrypto"
srcDir = "Vendor"

[[lean_lib]]
name = "HashSig"
srcDir = "Vendor"

[[lean_lib]]
name = "HashSigTest"
srcDir = "Vendor"

[[lean_lib]]
name = "LatticeCryptoTest"
srcDir = "Vendor"

[[lean_lib]]
name = "GordieHoweTest"
srcDir = "Test"

# The tests that read exported programs or certificates; their modules keep GordieHoweTest.* names.
[[lean_lib]]
name = "GordieHoweCertsTest"
srcDir = "Test"

# Audited ArkLib subset (BCIKS20 unique decoding, Johnson MCA); provenance is in Vendor/rs-provenance.json.
[[lean_lib]]
name = "ArkLib"
srcDir = "Vendor"
roots = []
globs = ["ArkLib.+"]

[[lean_lib]]
name = "CompPoly"
srcDir = "Vendor"
roots = []
globs = ["CompPoly.+"]

# Probability layer of the Johnson MCA subset (ArkLib's `mcaError` is a VCVio probability).
[[lean_lib]]
name = "VCVio"
srcDir = "Vendor"
roots = []
globs = ["VCVio.+"]

[[lean_lib]]
name = "ToMathlib"
srcDir = "Vendor"
roots = []
globs = ["ToMathlib.+"]

[[lean_lib]]
name = "PolyFun"
srcDir = "Vendor"
roots = []
globs = ["PolyFun.+"]

[[lean_lib]]
name = "ToCslib"
srcDir = "Vendor"
roots = []
globs = ["ToCslib.+"]

[[lean_lib]]
name = "Cslib"
srcDir = "Vendor"
roots = []
globs = ["Cslib.+"]
# cslib builds with Lean's default auto-bound implicits.
leanOptions = {autoImplicit = true, relaxedAutoImplicit = true}
